name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FA_VERSION: "7.3.1"
    steps:
      - uses: actions/checkout@v7


      - name: Install fonts (Liberation Sans, Font Awesome)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation unzip

          curl -sSL -o fontawesome.zip \
            "https://github.com/FortAwesome/Font-Awesome/releases/download/${FA_VERSION}/fontawesome-free-${FA_VERSION}-desktop.zip"
          unzip -j fontawesome.zip -d fonts/fontawesome \
            "fontawesome-free-${FA_VERSION}-desktop/otfs/*.otf"

          mkdir -p ~/.local/share/fonts
          cp fonts/fontawesome/*.otf ~/.local/share/fonts/
          fc-cache -f

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Compile resume
        run: typst compile resume/resume.typ site/public/resume.pdf

      - name: Setup pnpm + node
        uses: pnpm/setup@v1
        with:
          package-json-file: site/package.json
          install: false
          cache: true
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile
        working-directory: site

      - name: Build Astro site
        run: pnpm build
        working-directory: site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
